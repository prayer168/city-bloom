一樣多，加起來等於零。要做到淨零，最重要的是先大幅減少排放，再用吸收來抵銷剩下一點點。",related:["carbonSink","co2"]},carbonSink:{title:"碳吸收（碳匯）",body:"樹木在行光合作用時，會把空氣中的二氧化碳變成自己的身體。森林、海洋、濕地都能吸收二氧化碳，叫做「碳匯」。樹木長大的這幾十年吸收最多；已經很成熟的老森林，每年新吸收的量比較少，但它把大量的碳「存」在樹裡。砍掉樹林，存著的碳就會跑回空氣中。",fact:"遊戲為了簡化，只計算你新種的樹林：1 公頃每年約吸收 8 公噸；砍掉 1 公頃成熟樹林約釋放 150 公噸。一座燃煤電廠一個月就可能排放上千公噸，所以種樹很好，但不能取代減少排放。",related:["netZero"]},renewable:{title:"再生能源與綠電比例",body:"太陽能、風力、水力的能量來自大自然，用了還會再有，叫做「再生能源」，發電時幾乎不排放二氧化碳。「綠電比例」就是再生能源發的電占全部發電量的百分之幾。",fact:"核能發電時也幾乎不排碳，但它用的鈾礦會用完，所以不算再生能源。",related:["capacityFactor","storage"]},capacityFactor:{title:"容量因數",body:"一座電廠如果整個月都用最大力氣發電，叫做 100%。實際上太陽能晚上不發電、風有時候很小，所以實際發的電只有最大值的一部分，這個百分比就是「容量因數」。",fact:"在台灣，太陽能大約 12%–17%，冬天的風力可以到 40% 以上，核能大約 90%。",related:["renewable","baseload"]},storage:{title:"儲能",body:"儲能電池像一個超大的行動電源：中午太陽能發的電用不完時先存起來，晚上再放出來用。充電再放電的過程會損失一些電（遊戲裡約 15%）。",related:["curtail","renewable"]},curtail:{title:"棄電",body:"電廠發出來的電，如果沒有人用、也沒有地方存，就只好浪費掉，叫做「棄電」。多蓋儲能，或讓用電時間配合發電時間，都可以減少棄電。",related:["storage"]},rollingBlackout:{title:"輪流停電",body:"電不夠用的時候，電力公司會讓不同地區輪流停電，避免整個電網一起當機。在遊戲裡，離電廠最遠的地方會先停電。",related:["storage","baseload"]},baseload:{title:"基載電力",body:"不管白天晚上都穩定發電、出力固定的電廠，叫做基載電廠，例如核能。它很穩定，但不容易隨著用電多少調整。燃煤、燃氣電廠則可以依需要增加或減少發電。",related:["capacityFactor"]},nuclearWaste:{title:"核廢料",body:"核能電廠用過的燃料仍然有很強的輻射，需要非常長的時間（數千年以上）安全保存。要把核廢料放在哪裡，是許多國家都在討論的問題。",related:["baseload"]},kwh:{title:"度（電的單位）",body:"台灣電費單上的「1 度電」就是 1 千瓦小時（kWh）：一台 1000 瓦的電器用 1 小時。1,000 度 = 1 MWh（百萬瓦小時）。",fact:"台灣一個人在家裡每年大約用 2,000 度電。"},aqi:{title:"空氣品質指標",body:"用顏色告訴大家今天的空氣好不好：綠色良好、黃色普通、橘色對敏感族群不健康、紅色不健康。空氣不好的時候，氣喘的同學要特別小心。",fact:"遊戲裡的污染值是 0–255 的相對指標，只借用空氣品質指標的顏色分級，不是真實的 AQI 數字。",related:["pm25","monsoon"]},pm25:{title:"細懸浮微粒（PM2.5）",body:"飄在空氣中、比頭髮直徑小約 30 倍的小顆粒，主要來自工廠、電廠、汽機車排氣。它可以跑進肺部深處，對健康不好。",related:["aqi"]},monsoon:{title:"季風",body:"台灣冬天（約 10 月到隔年 4 月）吹東北季風，夏天（約 5 到 9 月）吹西南季風。風會把空氣污染吹向下風處，所以工廠蓋在住宅區的哪一邊很重要。",fact:"冬天東北季風也是台灣風力發電最多的季節。",related:["aqi","capacityFactor"]},landValue:{title:"地價",body:"一塊土地值多少錢。靠近水邊、公園、市中心、交通方便的地方比較貴；有污染、治安不好、常塞車的地方比較便宜。地價高的地方才會蓋高樓。",related:["zoning"]},zoning:{title:"都市計畫分區",body:"政府規劃每塊土地可以做什麼用：住宅區給人住、商業區開店和辦公、工業區設工廠。在台灣的都市計畫圖上，住宅區是黃色、商業區是紅色、工業區是紫色，遊戲也用同樣的顏色。",related:["landValue"]},commute:{title:"通勤",body:"每天從家裡到學校或上班地點，再回家的移動。住家和工作地點離得越遠，通勤越久，交通產生的碳排放也越多。",related:["transit"]},transit:{title:"大眾運輸",body:"公車、捷運、火車等大家一起搭的交通工具。一輛公車可以載幾十個人，平均每個人排放的二氧化碳比各自開車少很多，路上也比較不會塞車。",fact:"在遊戲裡，開車每人每公里約排放 0.12 公斤二氧化碳，搭公車約 0.03 公斤，騎腳踏車是 0。",related:["commute"]},heatIsland:{title:"都市熱島效應",body:"城市裡有很多柏油路、水泥建築，白天吸收大量太陽熱，晚上慢慢放出來；冷氣和汽機車還會排出廢熱。所以市中心常常比郊區熱好幾度，就像一座「熱的島」。",diagram:"heatLoop",fact:"這是一個「正回饋」：越熱越開冷氣，冷氣排出的廢熱又讓城市更熱。種樹、蓋公園、做綠屋頂或冷屋頂，可以打破這個循環。",related:["surfaceTemp","greenRoof","coolRoof","streetTrees"]},surfaceTemp:{title:"地表溫度",body:"地面本身的溫度，也就是你中午摸地板感覺到的熱度。夏天中午的柏油路可能超過 50 °C，草地和樹蔭下則涼很多。地表溫度通常比氣溫變化大。",related:["heatIsland"]},streetTrees:{title:"行道樹",body:"種在道路兩旁的樹。樹蔭擋住陽光，葉子蒸散水分也會帶走熱，所以有行道樹的路比較涼，走路和騎車也比較舒服。",related:["heatIsland"]},greenRoof:{title:"綠屋頂",body:"在建築屋頂種草、種花或小灌木。植物和土壤可以隔熱，讓樓下比較涼；下大雨時還能先吸住一些雨水。",related:["coolRoof","heatIsland"]},coolRoof:{title:"冷屋頂",body:"把屋頂塗成白色或淺色的反光材料，太陽光被反射回去，屋頂就不會那麼燙。做法簡單、價格便宜。",fact:"穿白衣服比穿黑衣服涼，也是同樣的道理。",related:["greenRoof","heatIsland"]},warming:{title:"暖化情境",body:"科學家用電腦模擬「如果全世界未來這樣排放，地球會變多熱」。IPCC（聯合國政府間氣候變遷專門委員會）用幾種情境來比較：大家一起大幅減碳是「低排放」，延續現在的做法是「中排放」，大量使用化石燃料是「高排放」。",fact:"依照 IPCC 第六次評估報告，到 2081–2100 年，全球平均溫度會比工業化前高約 1.8 °C（低排放）、2.7 °C（中排放）或 4.4 °C（高排放）。",related:["mitigation","adaptation","greenhouse"]},mitigation:{title:"減緩",body:"想辦法「少排放」溫室氣體，讓地球不要變得那麼熱。例如改用再生能源、多搭大眾運輸、節約用電。減緩需要全世界一起做，才看得到效果。",related:["adaptation","netZero"]},adaptation:{title:"調適",body:"氣候已經在改變，城市要「準備好」面對更熱的夏天、更強的大雨和颱風。例如多種樹降溫、蓋滯洪池防淹水、準備備用水源。調適可以保護城市裡的人，就算全世界還沒減碳成功也有用。",related:["mitigation","heatIsland"]}},O=(e,t)=>`<button type="button" class="wk" data-wiki="${e}">${t??ye[e]?.title??e}</button>`;function si(e,t){const s=document.createElement("div");s.className="modal-back wiki-back",s.hidden=!0,s.innerHTML='<div class="modal wiki-card" role="dialog" aria-modal="true" aria-labell
